name: Seilruteplanlegger

# Kjører hver 3. dag rundt kl. 07:00 norsk tid. Henter værdata (vind, kast,
# bølgehøyde, nedbør) og tidevannsdata for 5 faste punkter langs
# Oslo–Kosterøyene direkte fra MET Norway og Kartverket
# (scripts/seilruteplanlegger.mjs), sender dette til en GPT-modell hosted i
# Microsoft (Azure) AI Foundry for analyse, og skriver resultatet til den
# ene, faste filen i src/content/seilvarsel/ – siden /seilvarsel viser kun
# denne ene, gjeldende ruteplanen (erstattes hver kjøring, ikke en liste med
# separate artikler).
#
# Som i daglig-seilartikkel.yml kjører GitHub Actions cron alltid i UTC og
# følger ikke sommertid, så vi legger inn to cron-tidspunkter (ett for
# vintertid CET, ett for sommertid CEST) og lar et vaktbikkje-steg avgjøre
# hvilken kjøring som faktisk skal gjøre jobben.
#
# "*/3" i dag-i-måneden-feltet gir ikke matematisk nøyaktig "hver 3. dag"
# rundt månedsskifter (avstanden blir kortere der), men det er nøyaktig nok
# for en værbasert ruteplan som uansett blir foreldet etter noen dager.
on:
  schedule:
    - cron: '0 6 */3 * *' # 07:00 CET (vintertid, UTC+1)
    - cron: '0 5 */3 * *' # 07:00 CEST (sommertid, UTC+2)
  workflow_dispatch: {} # for å kunne kjøre den manuelt ved test/feilsøking

permissions:
  contents: write

concurrency:
  group: seilruteplanlegger
  cancel-in-progress: false

jobs:
  lag-ruteplan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sjekk at klokken er rundt 07:00 i Norge
        id: tidssjekk
        run: |
          now_oslo=$(TZ="Europe/Oslo" date +%H:%M)
          echo "Klokken er $now_oslo i Norge akkurat nå."
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || ("$now_oslo" > "06:45" && "$now_oslo" < "07:15") ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Utenfor tidsvinduet (06:45–07:15 norsk tid), denne av de to cron-kjøringene gjør ingenting."
          fi

      - name: Sett opp Node.js
        if: steps.tidssjekk.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sett opp Git-bruker for commit
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git config user.name "seiltips-bot"
          git config user.email "seiltips-bot@users.noreply.github.com"

      - name: Hent værdata og generer seilruteplan med Azure AI Foundry
        if: steps.tidssjekk.outputs.proceed == 'true'
        id: generer
        env:
          AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_MODEL: ${{ secrets.AZURE_FOUNDRY_MODEL }}
        run: node scripts/seilruteplanlegger.mjs

      - name: Commit og push ruteplanen
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          # git add -A (ikke bare den nye filen) slik at ev. slettede,
          # utdaterte filer fra tidligere kjøringer også blir committet bort.
          git add -A src/content/seilvarsel
          if git diff --cached --quiet; then
            echo "Ingen endring i seilruteplanen denne kjøringen – hopper over commit."
            exit 0
          fi
          periode_fra=$(grep -m1 '^periodeFra:' "${{ steps.generer.outputs.file }}" | cut -d' ' -f2)
          periode_til=$(grep -m1 '^periodeTil:' "${{ steps.generer.outputs.file }}" | cut -d' ' -f2)
          git commit -m "Oppdater seilruteplan: ${periode_fra} – ${periode_til}"
          git push

      - name: Verifiser at seilruteplanen faktisk finnes
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          if [ ! -s "${{ steps.generer.outputs.file }}" ]; then
            echo "::error::${{ steps.generer.outputs.file }} finnes ikke eller er tom."
            exit 1
          fi
          echo "Seilruteplan bekreftet oppdatert: ${{ steps.generer.outputs.file }}"
