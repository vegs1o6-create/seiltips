name: Daglig seilartikkel

# Kjører hver dag rundt kl. 16:25 norsk tid. GitHub Actions cron kjører alltid i UTC og
# følger ikke sommertid, så vi legger inn to cron-tidspunkter (ett for vintertid CET,
# ett for sommertid CEST) og lar en vaktbikkje-steg avgjøre hvilken kjøring som faktisk
# skal gjøre jobben.
on:
  schedule:
    - cron: '25 16 * * *' # 16:25 CET (vintertid, UTC+1)
    - cron: '25 15 * * *' # 16:25 CEST (sommertid, UTC+2)
  workflow_dispatch: {} # for å kunne kjøre den manuelt ved test/feilsøking

permissions:
  contents: write

concurrency:
  group: daglig-seilartikkel
  cancel-in-progress: false

jobs:
  skriv-artikkel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sjekk at klokken er rundt 16:25 i Norge
        id: tidssjekk
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manuelt trigget (workflow_dispatch) – kjører uansett klokkeslett."
            exit 0
          fi
          now_oslo=$(TZ="Europe/Oslo" date +%H:%M)
          echo "Klokken er $now_oslo i Norge akkurat nå."
          if [[ "$now_oslo" > "16:10" && "$now_oslo" < "16:40" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Utenfor tidsvinduet (16:10–16:40 norsk tid), denne av de to cron-kjøringene gjør ingenting."
          fi

      - name: Sett opp Node.js
        if: steps.tidssjekk.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sett opp Git-bruker for commit
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git config user.name "seiltips-bot"
          git config user.email "seiltips-bot@users.noreply.github.com"

      - name: Research og skriv dagens artikkel med Azure AI Foundry
        if: steps.tidssjekk.outputs.proceed == 'true'
        id: generer
        env:
          AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
        run: node scripts/daglig-seilartikkel.mjs

      - name: Commit og push artikkelen
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git add "${{ steps.generer.outputs.file }}"
          tittel=$(grep -m1 '^title:' "${{ steps.generer.outputs.file }}" | sed -E 's/^title:\s*"?([^"]+)"?\s*$/\1/')
          git commit -m "Legg til artikkel: ${tittel}"
          git push

      - name: Verifiser at en artikkel faktisk ble publisert
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git fetch origin "${{ github.ref_name }}"
          if [ -z "$(git log "origin/${{ github.ref_name }}" --since='30 minutes ago' -- src/content/artikler | head -1)" ]; then
            echo "::error::Ingen ny artikkel ble committet/pushet til src/content/artikler/ denne kjøringen."
            exit 1
          fi
          echo "Ny artikkel bekreftet pushet til src/content/artikler/."
