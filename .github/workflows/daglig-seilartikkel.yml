name: Daglig seilartikkel

# Kjører hver dag rundt kl. 08:00 norsk tid. GitHub Actions cron kjører alltid i UTC og
# følger ikke sommertid, så vi legger inn to cron-tidspunkter (ett for vintertid CET,
# ett for sommertid CEST). GitHub sin schedule-trigger kan komme flere timer for sent
# (observert opptil 9–15 timer), så i stedet for å kreve at kjøringen treffer et smalt
# klokkeslett-vindu, sjekker et vaktbikkje-steg heller om dagens artikkel allerede er
# publisert – da kan cron-kjøringen komme når den vil og likevel gjøre jobben, uten å
# risikere duplikater når begge cron-tidspunktene til slutt trigger samme dag.
on:
  schedule:
    - cron: '0 7 * * *' # ca. 08:00 CET (vintertid, UTC+1)
    - cron: '0 6 * * *' # ca. 08:00 CEST (sommertid, UTC+2)
  workflow_dispatch: {} # for å kunne kjøre den manuelt ved test/feilsøking

permissions:
  contents: write

concurrency:
  group: daglig-seilartikkel
  cancel-in-progress: false

jobs:
  skriv-artikkel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sjekk om dagens artikkel allerede er publisert
        id: tidssjekk
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manuelt trigget (workflow_dispatch) – kjører uansett."
            exit 0
          fi
          oslo_i_dag=$(TZ="Europe/Oslo" date +%F)
          siden=$(TZ="Europe/Oslo" date -d "${oslo_i_dag} 00:00:00" -u +"%Y-%m-%dT%H:%M:%SZ")
          til=$(TZ="Europe/Oslo" date -d "${oslo_i_dag} 23:59:59" -u +"%Y-%m-%dT%H:%M:%SZ")
          allerede=$(git log --since="$siden" --until="$til" --grep='^Legg til artikkel:' --oneline -- src/content/artikler)
          if [[ -n "$allerede" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "En artikkel er allerede publisert i dag (norsk dato ${oslo_i_dag}) – hopper over."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Ingen artikkel publisert i dag (norsk dato ${oslo_i_dag}) ennå – kjører uansett klokkeslett."
          fi

      - name: Sett opp Node.js
        if: steps.tidssjekk.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sett opp Git-bruker for commit
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git config user.name "seiltips-bot"
          git config user.email "seiltips-bot@users.noreply.github.com"

      - name: Research og skriv dagens artikkel med Azure AI Foundry
        if: steps.tidssjekk.outputs.proceed == 'true'
        id: generer
        env:
          AZURE_FOUNDRY_ENDPOINT: ${{ secrets.AZURE_FOUNDRY_ENDPOINT }}
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
        run: node scripts/daglig-seilartikkel.mjs

      - name: Commit og push artikkelen
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git add "${{ steps.generer.outputs.file }}"
          tittel=$(grep -m1 '^title:' "${{ steps.generer.outputs.file }}" | sed -E 's/^title:\s*"?([^"]+)"?\s*$/\1/')
          git commit -m "Legg til artikkel: ${tittel}"
          git push

      - name: Verifiser at en artikkel faktisk ble publisert
        if: steps.tidssjekk.outputs.proceed == 'true'
        run: |
          git fetch origin "${{ github.ref_name }}"
          if [ -z "$(git log "origin/${{ github.ref_name }}" --since='30 minutes ago' -- src/content/artikler | head -1)" ]; then
            echo "::error::Ingen ny artikkel ble committet/pushet til src/content/artikler/ denne kjøringen."
            exit 1
          fi
          echo "Ny artikkel bekreftet pushet til src/content/artikler/."
